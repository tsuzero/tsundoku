services:
  postgres:
    image: postgres:17-alpine@sha256:3540c0362c809df084ffac0ae69fe794515f9de92692f02178bcdce0ef0302ac
    environment:
      POSTGRES_DB: tsundoku
      POSTGRES_USER: tsundoku
      POSTGRES_PASSWORD: tsundoku
    ports:
      - "5432:5432"
    volumes:
      - tsundoku_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tsundoku"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  tsundoku_pg_data:
