<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Tsundoku — My reading list</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
    <script th:src="@{/webjars/htmx.org/dist/htmx.min.js}"></script>
</head>
<body>

<div th:insert="~{fragments/ui :: header}"></div>

<main class="main--list">

    <!-- Book list column -->
    <div class="books-column">
        <div class="filter-bar">
            <h1 class="shelf-title">To-read shelf</h1>

            <form hx-get="/books" hx-target="#book-list" hx-swap="innerHTML"
                  hx-push-url="true" hx-trigger="change"
                  class="filter-form">
                <label class="filter-label">
                    Availability
                    <select name="available">
                        <option value="" th:selected="${available == null or available == ''}">All</option>
                        <option value="true" th:selected="${available == 'true'}">Available</option>
                        <option value="false" th:selected="${available == 'false'}">Not found</option>
                        <option value="unknown" th:selected="${available == 'unknown'}">Unchecked</option>
                    </select>
                </label>
                <label class="filter-label">
                    Sort
                    <select name="sort">
                        <option value="title" th:selected="${sort == null or sort == 'title'}">Title</option>
                        <option value="author" th:selected="${sort == 'author'}">Author</option>
                        <option value="rating" th:selected="${sort == 'rating'}">Rating</option>
                        <option value="added" th:selected="${sort == 'added'}">Date added</option>
                    </select>
                </label>
            </form>
        </div>

        <div th:insert="~{fragments/ui :: bookList}"></div>
    </div>

    <!-- Sidebar -->
    <aside class="sidebar">
        <div th:insert="~{fragments/ui :: syncStatus}"></div>
    </aside>

</main>

<div th:insert="~{fragments/ui :: footer}"></div>

</body>
</html>
